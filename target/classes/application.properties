spring.application.name=driver-drowsiness-detection
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/drowsiness_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mvc.async.request-timeout=-1

detection.camera-index=0
detection.ear-threshold=0.25
detection.mar-threshold=0.70
detection.frame-threshold=18
detection.face-model-path=models/haarcascade_frontalface_default.xml
detection.landmark-model-path=models/lbfmodel.yaml
